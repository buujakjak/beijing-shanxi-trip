function renderHeader(){ $("tripStrip").textContent=`${data.tripName} ${data.days.length} 天 ${data.days.length-1} 夜｜${data.start.replaceAll("-",".")}–${data.end.replaceAll("-",".")}`;const diff=Math.ceil((new Date(data.start+"T00:00:00")-new Date(new Date().toDateString()))/86400000);$("countdown").textContent=diff>=0?`出發倒數 ${diff} 天`:"旅程已開始／結束"}
function renderRail(){const rail=$("dateRail");rail.innerHTML="";data.days.forEach((d,i)=>{const b=document.createElement("button");b.className="day-choice"+(i===selectedDay?" active":"");b.innerHTML=`<span class="day-dot"></span><span class="day-date">${dateLabel(d.date)}</span><span class="day-week">週${weekday(d.date)}</span>`;b.onclick=()=>{selectedDay=i;renderDay()};rail.appendChild(b)})}
function renderDay(){const d=data.days[selectedDay];$("dayLabel").textContent=`Day ${selectedDay+1}`;$("dayHeading").textContent=d.title;$("daySub").textContent=d.sub||"";renderRail();const tl=$("timeline");tl.innerHTML="";d.events.forEach((e,i)=>{const el=document.createElement("div");el.className="event";const content=e.kind==="box"?`<div class="event-box">${esc(e.text)}</div>`:`<div class="event-note"><span class="tag ${tagClass(e.tag)}">${esc(e.tag||"活動")}</span>${esc(e.text)}</div>`;el.innerHTML=`<div class="time">${esc(e.time)}</div>${content}<div class="event-actions" style="grid-column:2"><button data-edit="${i}">編輯</button><button data-del="${i}">刪除</button></div>`;tl.appendChild(el)});tl.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>editEvent(+b.dataset.edit));tl.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{if(confirm("確定刪除這項活動？")){d.events.splice(+b.dataset.del,1);save();renderDay()}});$("hotelPanel").innerHTML=`<b>住宿</b><div class="hotel"><div class="hotel-name">${esc(d.hotel||"未填寫")}</div><div class="hotel-address">${esc(d.address||"")}</div>${d.note?`<p class="muted">${esc(d.note)}</p>`:""}</div>`}
function tagClass(t){if(/火車|高鐵/.test(t))return"train";if(/飛機/.test(t))return"plane";if(/巴士|接駁|交通|計程車/.test(t))return"bus";if(/步行|景區/.test(t))return"walk";return"info"}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function field(label,name,value,placeholder=""){return `<label class="field">${label}<input name="${name}" value="${esc(value||"")}" placeholder="${esc(placeholder)}"></label>`}
function textarea(label,name,value){return `<label class="field">${label}<textarea name="${name}">${esc(value||"")}</textarea></label>`}
function openDialog(title,fields,onSave){$("dialogTitle").textContent=title;$("dialogFields").innerHTML=fields;const dlg=$("editDialog"),form=$("editForm");dlg.showModal();form.onsubmit=e=>{e.preventDefault();const fd=new FormData(form);onSave(fd);dlg.close();save();renderAll()}}
function editEvent(i){const e=i<0?{time:"",kind:"box",tag:"",text:""}:data.days[selectedDay].events[i];openDialog(i<0?"新增活動":"編輯活動",field("時間","time",e.time,"例如 09:30")+`<label class="field">顯示方式<select name="kind"><option value="box" ${e.kind==="box"?"selected":""}>活動卡片</option><option value="note" ${e.kind==="note"?"selected":""}>交通／備註標籤</option></select></label>`+field("標籤（例如 🚆 火車）","tag",e.tag,"例如 🚇 地鐵")+textarea("活動內容","text",e.text),fd=>{const v={time:fd.get("time"),kind:fd.get("kind"),tag:fd.get("tag"),text:fd.get("text")};if(i<0)data.days[selectedDay].events.push(v);else data.days[selectedDay].events[i]=v})}
function editHotel(){const d=data.days[selectedDay];openDialog("編輯住宿",field("住宿名稱","hotel",d.hotel)+textarea("住宿地址","address",d.address)+textarea("備註（選填）","note",d.note),fd=>{d.hotel=fd.get("hotel");d.address=fd.get("address");d.note=fd.get("note")})}
function renderFlights(){$("flights").innerHTML=data.flights.map((f,i)=>`<div class="panel" style="padding:0;overflow:hidden"><div class="flight-head"><span>${esc(f.date)}｜${esc(f.label)}</span><span>${esc(f.code)}</span></div><div class="flight-body"><div class="flight-times"><span>${esc(f.time)}</span><span class="flight-line"></span><span>✈</span></div><div class="muted">${esc(f.from)} → ${esc(f.to)}</div><div class="muted">${esc(f.note)}</div></div></div>`).join("")}
function editFlights(){let fields="";data.flights.forEach((f,i)=>{fields+=`<div class="panel"><b>${esc(f.label)}</b>${field("日期","date"+i,f.date)}${field("航班編號","code"+i,f.code)}${field("起飛時間","time"+i,f.time)}${field("出發地","from"+i,f.from)}${field("目的地","to"+i,f.to)}${textarea("備註","note"+i,f.note)}</div>`});openDialog("編輯航班",fields,fd=>data.flights.forEach((f,i)=>["date","code","time","from","to","note"].forEach(k=>f[k]=fd.get(k+i)))}
function renderChecks(){$("checklist").innerHTML="";data.checks.forEach((c,i)=>{const row=document.createElement("label");row.className="checkline";row.innerHTML=`<input type="checkbox" data-check="${i}" ${c.done?"checked":""}><span>${esc(c.text)}</span><button type="button" class="btn small danger" data-remove="${i}" style="margin-left:auto">刪除</button>`;$("checklist").appendChild(row)});$("checklist").querySelectorAll("[data-check]").forEach(x=>x.onchange=()=>{data.checks[+x.dataset.check].done=x.checked;save()});$("checklist").querySelectorAll("[data-remove]").forEach(x=>x.onclick=e=>{e.preventDefault();data.checks.splice(+x.dataset.remove,1);save();renderChecks()})}
function renderAll(){renderHeader();renderDay();renderFlights();renderChecks()}
$("addEvent").onclick=()=>editEvent(-1);$("editHotel").onclick=editHotel;$("editFlights").onclick=editFlights;
$("addCheck").onclick=()=>openDialog("新增待辦",field("事項","text",""),fd=>data.checks.push({text:fd.get("text"),done:false}));
$("cancelDialog").onclick=()=>$("editDialog").close();
document.querySelectorAll(".nav-btn").forEach(b=>b.onclick=()=>{document.querySelectorAll(".nav-btn").forEach(x=>x.classList.toggle("active",x===b));document.querySelectorAll(".page").forEach(x=>x.classList.add("hidden"));$(b.dataset.page+"Page").classList.remove("hidden");window.scrollTo({top:0,behavior:"smooth"})});
$("exportData").onclick=()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="我的旅行手帳備份.json";a.click();URL.revokeObjectURL(a.href);toast("備份檔已匯出")};
$("importFile").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const imported=JSON.parse(await f.text());if(!Array.isArray(imported.days)||!Array.isArray(imported.flights))throw Error();data=imported;selectedDay=0;save();renderAll();toast("備份還原成功")}catch(err){alert("檔案格式不正確，未能匯入。")}e.target.value=""};
if("serviceWorker" in navigator && location.protocol.startsWith("http"))window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
renderAll();
</script></body></html>
